[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-flow"
version = "0.2.0"
description = "Safety-focused multi-agent real-estate valuation service"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.17.2",
    "asyncpg==0.30.0",
    "fastapi==0.162.0",
    "google-genai==1.52.0",
    "httpx==0.28.1",
    "langchain==1.0.5",
    "langchain-google-genai==3.0.1",
    "langgraph==1.0.3",
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.2.1",
    "psycopg[binary]==3.2.10",
    "sqlalchemy[asyncio]==2.0.57",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.14.4",
]

[tool.setuptools]
packages = ["agents"]
package-dir = {"" = "backend"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = [
    "backend/config.py",
    "backend/database.py",
    "backend/models.py",
    "backend/rate_limit.py",
    "backend/schemas.py",
    "backend/agents/graph.py",
]
strict = true
warn_unused_configs = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
