services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      DATABASE_URL: postgresql+asyncpg://oracle_flow:oracle_flow@postgres:5432/oracle_flow
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: oracle_flow
      POSTGRES_USER: oracle_flow
      POSTGRES_PASSWORD: oracle_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U oracle_flow -d oracle_flow
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
